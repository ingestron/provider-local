apiVersion: ingestron.provider/v1
id: local
version: 0.4.18
platform: local
activities: {}
compatibility:
  plan: ingestron.plan/v1
  minimumCli: 4.2.0
  requiredFeatures:
    - connector-runtime-capabilities
    - project-connections
    - odcs-connections
    - project-assembly
    - connection-metadata-documents
    - provider-execution
    - source-checkpoint-migration
    - provider-execution-resources
    - provider-execution-acknowledgement
    - connector-schedule-handover
    - portable-scheduler
execution:
  apiVersion: ingestron.execution/v1
  transport: local-python/v1
  entryPoint: execute.py
  actions:
    - prepare
    - catalogue
    - discover
    - review
    - approve
    - run
    - checkpoint_preview
    - checkpoint_apply
  status: receipt
  retry: same-run-id
  cancellation: interrupt
  acknowledgement: provider-journal/v1
  resources:
    apiVersion: ingestron.execution-resources/v1
    command: execution resources
sourceAccess:
  apiVersion: ingestron.source-access-host/v1
  transport: local-python/v1
  entryPoint: source_access_host.py
connectorRuntimes:
  ingestron.snapshot/python/v1:
    selectionSchema:
      type: object
      additionalProperties:
        type: object
        properties:
          name:
            type: string
            minLength: 1
          fields:
            type: object
            additionalProperties:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - integer
                    - string
                    - boolean
                    - number
                    - decimal
                    - json
                    - date
                    - timestamp
                nullable:
                  type: boolean
                target:
                  type: string
                  minLength: 1
                precision:
                  type: integer
                scale:
                  type: integer
              required:
                - type
                - nullable
              additionalProperties: false
        required:
          - name
          - fields
        additionalProperties: false
    executionSchema:
      type: object
      properties:
        mode:
          type: string
          enum:
            - local
        ingestion:
          type: string
          enum:
            - incremental
      required:
        - mode
      additionalProperties: false
    executionPlatforms:
      - local
    scheduling:
      apiVersion: ingestron.connector-schedule/v1
      clock: portable
      recurrences:
        - interval
        - daily
        - weekly
        - monthly
    prepareCommand: connection prepare
    metadataDocuments: ingestron.metadata-documents/v1
    contractsCommand: connector contracts
lifecycle:
  apiVersion: ingestron.provider-lifecycle/v1
  module: ./lifecycle.mjs
commands:
  apiVersion: ingestron.provider-commands/v1
  execution: offline-json
  module: ./commands.mjs
  definitions:
    - name: execution resources
      description: Declare the selected compiled local output namespaces without
        source access
      inputSchema:
        type: object
        properties:
          packageRoot:
            type: string
            minLength: 1
            maxLength: 2048
          flows:
            type: array
            items:
              type: string
              minLength: 1
              maxLength: 100
            minItems: 1
            maxItems: 100
        required:
          - packageRoot
          - flows
        additionalProperties: false
    - name: connection prepare
      description: Prepare a project-resolved connection, selected fields and
        runtime-only secrets
      inputSchema:
        type: object
        additionalProperties: true
    - name: connector contracts
      description: Export reviewed ODCS contracts
      inputSchema:
        type: object
        properties:
          review:
            type: object
        required:
          - review
        additionalProperties: false
    - name: project assemble
      description: Assemble one scoped platform project without deployment
      inputSchema:
        type: object
        additionalProperties: true
projectAssembly:
  apiVersion: ingestron.project-assembly/v1
  command: project assemble
  metadataDocuments: ingestron.metadata-documents/v1
